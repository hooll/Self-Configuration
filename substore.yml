# URL 重写(Stash)
url-rewrite:
  - ^https?:\/\/(www.)?(g|google)\.cn https://www.google.com 302
  - ^https?:\/\/(ditu|maps).google\.cn https://maps.google.com 302

# 代理节点
proxies: []

# 代理组配置
proxy-groups:
  # 🚀 节点选择: 主入口
  - name: 🚀 节点选择
    type: select
    proxies:
      - ♻️ 自动选择
      - 🚀 手动切换
      - DIRECT

  # 🚀 手动切换: 包含脚本抓取到的所有节点
  - name: 🚀 手动切换
    type: select
    proxies: [] # 脚本会自动填充

  # ♻️ 自动选择: 包含脚本抓取到的所有节点
  - name: ♻️ 自动选择
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    proxies: [] # 脚本会自动填充

  # === 下方策略组已简化，移除了具体的国家分组，统一指向主入口 ===
  
  # 🌐 国际流量
  - name: 🌐 国际流量
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - 🚀 手动切换

  # 🎯 国内流量
